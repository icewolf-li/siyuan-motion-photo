name: Publish SiYuan plugin release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          plugin_version="$(node -p "require('./plugin.json').version")"
          if [[ "$tag_version" != "$package_version" || "$tag_version" != "$plugin_version" ]]; then
            echo "Tag ($tag_version), package.json ($package_version), and plugin.json ($plugin_version) versions must match."
            exit 1
          fi

      - name: Build package
        run: pnpm run build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" package.zip --verify-tag --generate-notes
